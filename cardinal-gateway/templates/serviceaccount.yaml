{{- if .Values.serviceAccount.create }}
{{- /*
S3 write access binds to THIS service account (EKS Pod Identity association or
IRSA role annotation). Renaming it silently removes the pod's credentials.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cardinal-gateway.serviceAccountName" . }}
  labels:
    {{- include "cardinal-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
