name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  charts:
    name: lint + test charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.0.0
      - run: make test
