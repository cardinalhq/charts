{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "conductor.serviceAccountName" . }}
  labels:
    {{- include "lakerunner.labels" . | nindent 4 }}
  annotations:
    # Pre-install/pre-upgrade hook (weight -10) so the SA's RBAC exists before
    # the bootstrap migrate/key-seed Jobs (weight 0) run. See serviceaccount.yaml
    # for why there is deliberately no hook-delete-policy here.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # The monitoring container lists HPAs to report autoscaling state; the chart
  # ships process-hpa.yaml, so this is its own resource. Present in the
  # standalone lakerunner chart's role.yaml and lost in the port to conductor:
  #   horizontalpodautoscalers.autoscaling is forbidden:
  #   User "system:serviceaccount:<ns>:<sa>" cannot list resource
  #   "horizontalpodautoscalers" in API group "autoscaling"
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "conductor.serviceAccountName" . }}
  labels:
    {{- include "lakerunner.labels" . | nindent 4 }}
  annotations:
    # Pre-install/pre-upgrade hook (weight -10) so the binding exists before
    # the Jobs run. No hook-delete-policy — see serviceaccount.yaml.
    # the bootstrap migrate/key-seed Jobs (weight 0) run. See serviceaccount.yaml.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "conductor.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conductor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
