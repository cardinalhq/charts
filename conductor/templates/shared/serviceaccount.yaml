{{- if .Values.serviceAccount.create -}}
# Runtime ServiceAccount: a PLAIN resource, deliberately NOT a helm hook.
#
# It used to be a pre-install/pre-upgrade hook (so the bootstrap Jobs could
# mount it), with no hook-delete-policy on the theory that helm would then
# apply it in place. That holds for plain helm, but ArgoCD assigns hooks a
# DEFAULT deletion policy of BeforeHookCreation, so every sync deleted and
# recreated the SA. Recreation gives it a new UID, and projected SA tokens are
# bound to that UID, so every already-running pod's token went 401:
#   Failed to watch *v1.Service: failed to list *v1.Service: Unauthorized
# (401 Unauthorized, not 403 Forbidden — the RBAC was fine, the identity died.)
#
# The bootstrap Jobs now mount their own throwaway hook SA (below), so this one
# can live in the main phase where nothing ever deletes it. Cloud-credential
# associations (AWS Pod Identity / IRSA) bind to this SA's NAME — keep it stable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conductor.serviceAccountName" . }}
  labels:
    {{- include "lakerunner.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Bootstrap ServiceAccount: mounted only by the bootstrap hook Jobs (migrate,
# detect, key-seed), which are DB-only and need no k8s RBAC or cloud identity —
# they just need an SA that exists before pre-install hooks run. Deletion and
# recreation every sync is harmless here: each Job's pods are new anyway.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conductor.bootstrapServiceAccountName" . }}
  labels:
    {{- include "lakerunner.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
{{- end }}
