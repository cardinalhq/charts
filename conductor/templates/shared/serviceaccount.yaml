{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conductor.serviceAccountName" . }}
  labels:
    {{- include "lakerunner.labels" . | nindent 4 }}
  annotations:
    # Created as a pre-install/pre-upgrade hook (earlier than the migrate/key-seed
    # bootstrap Jobs at weight 0) so those hook Jobs can mount this ServiceAccount.
    # Without a hook annotation the SA is created in the main phase, AFTER pre-install
    # hooks run, and the migrate Jobs fail with "serviceaccount not found".
    # NO hook-delete-policy. before-hook-creation DELETES and recreates the
    # ServiceAccount on every install/upgrade (and every ArgoCD sync), which
    # gives it a new UID and silently invalidates the projected tokens of all
    # already-running pods:
    #   Failed to watch *v1.Service: failed to list *v1.Service: Unauthorized
    # That is a 401, not a 403 — the RBAC rules are fine, the identity is gone.
    # hook-succeeded is worse (deletes it while the release still needs it).
    # Omitting the policy leaves the object in place and applies it in-place.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
