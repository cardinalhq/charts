{{- /*
One Deployment per metrics role; body in _process-worker.tpl.
*/ -}}
{{- $sig := include "lakerunner.processSignalValues" (list . "metrics") | fromYaml }}
{{- if $sig.enabled }}
{{- range $role := include "lakerunner.processRoles" "metrics" | fromJsonArray }}
---
{{ include "lakerunner.processWorker" (dict "root" $ "signal" "metrics" "role" $role) }}
{{- end }}
{{- end }}
