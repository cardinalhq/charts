{{- /*
One Deployment per traces role; body in _process-worker.tpl.
*/ -}}
{{- $sig := include "lakerunner.processSignalValues" (list . "traces") | fromYaml }}
{{- if $sig.enabled }}
{{- range $role := include "lakerunner.processRoles" "traces" | fromJsonArray }}
---
{{ include "lakerunner.processWorker" (dict "root" $ "signal" "traces" "role" $role) }}
{{- end }}
{{- end }}
