{{- /*
One Deployment per logs role; body in _process-worker.tpl.
*/ -}}
{{- $sig := include "lakerunner.processSignalValues" (list . "logs") | fromYaml }}
{{- if $sig.enabled }}
{{- range $role := include "lakerunner.processRoles" "logs" | fromJsonArray }}
---
{{ include "lakerunner.processWorker" (dict "root" $ "signal" "logs" "role" $role) }}
{{- end }}
{{- end }}
