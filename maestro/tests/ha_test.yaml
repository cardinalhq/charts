suite: HA / POC mode toggle, mcp-gateway sidecar topology
templates:
  - maestro-deployment.yaml
tests:
  # ---- POC defaults (ha.enabled=false) ----------------------------------
  - it: "POC default: maestro replicas auto-derive to 1"
    template: maestro-deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: "HA: maestro replicas auto-derive to 2"
    template: maestro-deployment.yaml
    set:
      ha.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: "HA: explicit higher maestro replicas honored"
    template: maestro-deployment.yaml
    set:
      ha.enabled: true
      maestro.replicas: 4
    asserts:
      - equal:
          path: spec.replicas
          value: 4

  - it: "maestro pod includes the mcp-gateway sidecar"
    template: maestro-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "mcp-gateway")].name
          value: mcp-gateway
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "mcp-gateway")].restartPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[?(@.name == "mcp-gateway")].args[0]
          value: mcp-gateway

  - it: "maestro talks to gateway over localhost (no Service hop)"
    template: maestro-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MCP_GATEWAY_URL
            value: "http://localhost:8080"

  - it: "HA with maestro.replicas=1 fails template rendering"
    template: maestro-deployment.yaml
    set:
      ha.enabled: true
      maestro.replicas: 1
    asserts:
      - failedTemplate:
          errorMessage: "ha.enabled=true requires maestro.replicas >= 2 (got 1). Lower replica counts are POC mode; set ha.enabled=false."

  - it: "POC with explicit maestro.replicas=3 honored (degenerate but allowed)"
    template: maestro-deployment.yaml
    set:
      maestro.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  # ---- robustness against operator-input quirks -------------------------
  - it: "empty-string maestro.replicas treated as unset (auto-derives)"
    template: maestro-deployment.yaml
    set:
      maestro.replicas: ""
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: "HA with empty-string maestro.replicas auto-derives to 2 (not blank)"
    template: maestro-deployment.yaml
    set:
      ha.enabled: true
      maestro.replicas: ""
    asserts:
      - equal:
          path: spec.replicas
          value: 2

  - it: "stringly ha.enabled (--set-string) fails loud (don't silently ignore a typo)"
    template: maestro-deployment.yaml
    set:
      ha.enabled: "true"
    asserts:
      - failedTemplate:
          errorMessage: "ha.enabled must be a YAML boolean (true or false), got true of type string. Use `--set ha.enabled=true` / `=false`, not `--set-string`."

