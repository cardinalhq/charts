suite: bundled dex install
templates:
  - dex-configmap.yaml
  - dex-deployment.yaml
  - dex-service.yaml
  - ingress.yaml
  - maestro-deployment.yaml
tests:
  - it: emits no dex resources and no OIDC env when disabled
    set:
      ingress.enabled: true
      ingress.host: m.example.com
    asserts:
      - template: dex-configmap.yaml
        hasDocuments: { count: 0 }
      - template: dex-deployment.yaml
        hasDocuments: { count: 0 }
      - template: dex-service.yaml
        hasDocuments: { count: 0 }
      - template: maestro-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_URL

  - it: derives https issuer from ingress.host + ingress.tls
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      ingress.tls:
        - hosts: [m.example.com]
          secretName: tls
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_URL
            value: https://m.example.com/dex
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAESTRO_BASE_URL
            value: https://m.example.com

  - it: derives http issuer when ingress.tls absent
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_URL
            value: http://m.example.com/dex

  - it: explicit maestro.baseUrl wins over ingress.host
    set:
      dex.enabled: true
      maestro.baseUrl: https://override.example.com/
      ingress.enabled: true
      ingress.host: ignored.example.com
      ingress.tls:
        - hosts: [ignored.example.com]
          secretName: tls
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_URL
            value: https://override.example.com/dex
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MAESTRO_BASE_URL
            value: https://override.example.com

  - it: normalizes a scheme prefix in ingress.host
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: https://m.example.com/
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      # scheme stripped, trailing / stripped, scheme reapplied from
      # ingress.tls (absent here, so http)
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_URL
            value: http://m.example.com/dex

  - it: fails when dex enabled with no base URL
    set:
      dex.enabled: true
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.enabled=true requires either maestro.baseUrl to be set or ingress.host to be set so the Dex issuer URL can be derived"

  - it: fails when dex enabled with empty staticUsers
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.enabled=true requires dex.staticUsers or dex.connectors to be non-empty (otherwise the bundled Dex starts with no login options)"

  - it: fails when dex.replicas > 1
    set:
      dex.enabled: true
      dex.replicas: 2
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.replicas > 1 is incompatible with the bundled Dex's in-memory storage; sessions and signing keys diverge across pods. Use a single replica or replace the bundled Dex with an external OIDC provider for HA."

  - it: built-in OIDC_ISSUER_URL wins over a user maestro.env duplicate
    set:
      # Disabled so this ordering check stays isolated from split mode's
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
      maestro.env:
        - name: OIDC_ISSUER_URL
          value: https://attacker.example.com/dex
    template: maestro-deployment.yaml
    asserts:
      # Both entries exist; built-in is emitted first so Kubernetes
      # picks it over the user-supplied duplicate.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_URL
            value: http://m.example.com/dex
      # Lock in the ordering: built-in OIDC_ISSUER_URL is emitted
      # immediately after WORKING_DIRECTORY (env[9]), so it lands at
      # env[10] — comfortably before any user maestro.env entry, and
      # Kubernetes picks the first occurrence on duplicates.
      - equal:
          path: spec.template.spec.containers[0].env[10].name
          value: OIDC_ISSUER_URL
      - equal:
          path: spec.template.spec.containers[0].env[10].value
          value: http://m.example.com/dex

  - it: ingress lists /dex before / when dex enabled
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: ingress.yaml
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /dex
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME-maestro-dex
      - equal:
          path: spec.rules[0].http.paths[1].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[1].backend.service.name
          value: RELEASE-NAME-maestro-maestro

  - it: ingress omits /dex path when dex disabled
    set:
      ingress.enabled: true
      ingress.host: m.example.com
    template: ingress.yaml
    asserts:
      - lengthEqual:
          path: spec.rules[0].http.paths
          count: 1
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /

  - it: embeds the static user in the dex configmap
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: admin@example.com
          hash: "$2a$10$abc"
          userID: 00000000-0000-0000-0000-000000000001
          username: admin
          groups:
            - maestro-superadmin
    template: dex-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "issuer: http://m.example.com/dex"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "redirectURIs:\\s*\\n\\s*- http://m.example.com/"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "email: admin@example.com"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "userID: 00000000-0000-0000-0000-000000000001"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "- maestro-superadmin"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "hash: \\$2a\\$10\\$abc"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "hashFromEnv"

  - it: reads a hashSecretRef user's hash from the named Secret, never from the configmap
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: inline@example.com
          username: inline
          userID: u0
          hash: "$2a$10$abc"
        - email: admin@example.com
          username: admin
          userID: u1
          hashSecretRef:
            name: maestro-dex-static-users
            key: admin
    asserts:
      # user[1] (not the first secret-backed user) maps to the _1_ env var
      - template: dex-configmap.yaml
        matchRegex:
          path: data["config.yaml"]
          pattern: "email: admin@example.com\\s*\\n\\s*hashFromEnv: DEX_STATIC_USER_1_HASH"
      - template: dex-configmap.yaml
        notMatchRegex:
          path: data["config.yaml"]
          pattern: "hashSecretRef|maestro-dex-static-users"
      - template: dex-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_STATIC_USER_1_HASH
            valueFrom:
              secretKeyRef:
                name: maestro-dex-static-users
                key: admin
      - template: dex-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_STATIC_USER_0_HASH
          any: true
      # the hash stays in the Dex pod; maestro never receives it
      - template: maestro-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_STATIC_USER_1_HASH
          any: true

  - it: fails when a static user sets both hash and hashSecretRef
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
          hashSecretRef: { name: s, key: k }
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.staticUsers[] entries set either hash or hashSecretRef, not both"

  - it: fails when hashSecretRef omits the key
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hashSecretRef: { name: s }
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.staticUsers[].hashSecretRef requires both name and key (the existing Secret and the key holding that user's bcrypt hash)"

  - it: appends extraRedirectURIs after the canonical base-url redirect
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
      dex.extraRedirectURIs:
        - http://localhost:5173/
    template: dex-configmap.yaml
    asserts:
      # canonical base-url redirect still first, extra appended after it
      - matchRegex:
          path: data["config.yaml"]
          pattern: "redirectURIs:\\s*\\n\\s*- http://m.example.com/\\s*\\n\\s*- \"http://localhost:5173/\""

  - it: registers only the base-url redirect when extraRedirectURIs is unset
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: dex-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "localhost"

  - it: emits web.allowedOrigins when dex.allowedOrigins is set
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
      dex.allowedOrigins:
        - http://localhost:5173
    template: dex-configmap.yaml
    asserts:
      # allowedOrigins nested under web:, before oauth2:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "web:\\s*\\n\\s*http: 0.0.0.0:5556\\s*\\n\\s*allowedOrigins:\\s*\\n\\s*- \"http://localhost:5173\""

  - it: omits web.allowedOrigins when dex.allowedOrigins is unset
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: dex-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "allowedOrigins"

  - it: dex deployment mounts a writable /tmp emptyDir
    set:
      dex.enabled: true
      ingress.enabled: true
      ingress.host: m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: dex-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}

  - it: emits DEX_PROXY_PATH and DEX_PROXY_TARGET when dex.enabled
    set:
      dex.enabled: true
      maestro.baseUrl: https://m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_PATH
            value: /dex
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_TARGET
            value: http://RELEASE-NAME-maestro-dex.NAMESPACE.svc:5556/dex

  - it: respects custom dex.pathPrefix in DEX_PROXY env
    set:
      dex.enabled: true
      dex.pathPrefix: /idp
      maestro.baseUrl: https://m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_PATH
            value: /idp
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_TARGET
            value: http://RELEASE-NAME-maestro-dex.NAMESPACE.svc:5556/idp

  - it: omits DEX_PROXY env when dex.proxyEnabled is false
    set:
      dex.enabled: true
      dex.proxyEnabled: false
      maestro.baseUrl: https://m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: maestro-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_PATH
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_TARGET

  - it: emits no DEX_PROXY env when dex.enabled is false
    set:
      ingress.enabled: true
      ingress.host: m.example.com
    template: maestro-deployment.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_PATH
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DEX_PROXY_TARGET

  - it: keeps the password DB on by default with static users only
    set:
      dex.enabled: true
      maestro.baseUrl: https://m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
    template: dex-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enablePasswordDB: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "staticPasswords:"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "connectors:"

  - it: renders a Google connector, defaults its redirectURI and disables the password DB
    set:
      dex.enabled: true
      dex.enablePasswordDB: false
      maestro.baseUrl: https://m.example.com
      dex.connectors:
        - type: google
          id: google
          name: Google
          config:
            clientID: $GOOGLE_CLIENT_ID
            clientSecret: $GOOGLE_CLIENT_SECRET
            hostedDomains: [example.com]
    template: dex-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enablePasswordDB: false"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^connectors:$"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^  - config:$"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "clientSecret: \\$GOOGLE_CLIENT_SECRET"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "hostedDomains:\\s+- example.com"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "redirectURI: https://m.example.com/dex/callback"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^    type: google$"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "staticPasswords"

  - it: keeps an explicit connector redirectURI
    set:
      dex.enabled: true
      dex.enablePasswordDB: false
      maestro.baseUrl: https://m.example.com
      dex.connectors:
        - type: google
          id: google
          name: Google
          config:
            redirectURI: https://elsewhere.example.com/dex/callback
    template: dex-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "redirectURI: https://elsewhere.example.com/dex/callback"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "redirectURI: https://m.example.com/dex/callback"

  - it: allows connectors next to static users with the password DB on
    set:
      dex.enabled: true
      maestro.baseUrl: https://m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
      dex.connectors:
        - { type: google, id: google, name: Google, config: {} }
    template: dex-configmap.yaml
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "enablePasswordDB: true"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "staticPasswords:"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "id: google"

  - it: adds dex.env to the Dex container only
    set:
      dex.enabled: true
      dex.enablePasswordDB: false
      maestro.baseUrl: https://m.example.com
      dex.env:
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef: { name: maestro-dex-google, key: client-secret }
      dex.connectors:
        - { type: google, id: google, name: Google, config: {} }
    asserts:
      - template: dex-deployment.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef: { name: maestro-dex-google, key: client-secret }
      - template: maestro-deployment.yaml
        notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef: { name: maestro-dex-google, key: client-secret }

  - it: fails when the password DB is off but static users remain
    set:
      dex.enabled: true
      dex.enablePasswordDB: false
      maestro.baseUrl: https://m.example.com
      dex.staticUsers:
        - email: a@example.com
          username: a
          userID: u1
          hash: "$2a$10$abc"
      dex.connectors:
        - { type: google, id: google, name: Google, config: {} }
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.enablePasswordDB=false disables Dex's password login, so dex.staticUsers must be empty"

  - it: fails when the password DB is off and there are no connectors
    set:
      dex.enabled: true
      dex.enablePasswordDB: false
      maestro.baseUrl: https://m.example.com
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.enablePasswordDB=false requires at least one entry in dex.connectors (otherwise the bundled Dex starts with no login options)"

  - it: fails on a connector without an id
    set:
      dex.enabled: true
      dex.enablePasswordDB: false
      maestro.baseUrl: https://m.example.com
      dex.connectors:
        - { type: google, name: Google }
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.connectors[] entries need type and id (Dex connector syntax)"

  - it: fails on duplicate connector ids
    set:
      dex.enabled: true
      dex.enablePasswordDB: false
      maestro.baseUrl: https://m.example.com
      dex.connectors:
        - { type: google, id: google }
        - { type: oidc, id: google }
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.connectors[] ids must be unique (duplicate \"google\")"

  - it: fails on the reserved local connector id
    set:
      dex.enabled: true
      maestro.baseUrl: https://m.example.com
      dex.connectors:
        - { type: oidc, id: local }
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.connectors[] id \"local\" is reserved for Dex's password database"

  - it: rejects a non-boolean enablePasswordDB
    set:
      dex.enabled: true
      dex.enablePasswordDB: "false"
      maestro.baseUrl: https://m.example.com
      dex.connectors:
        - { type: google, id: google }
    template: maestro-deployment.yaml
    asserts:
      - failedTemplate:
          errorMessage: "dex.enablePasswordDB must be a YAML boolean (true or false), got false of type string. Use `--set dex.enablePasswordDB=true` / `=false`, not `--set-string`."
