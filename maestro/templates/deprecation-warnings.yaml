{{/*
Deprecation warnings for removed or renamed features.
This template doesn't produce any resources, it only validates configuration.
*/}}

{{- $m := .Values.maestro | default dict }}
{{- if or $m.persistence $m.temporaryStorage }}
{{- fail `
================================================================================
REMOVED: maestro.persistence / maestro.temporaryStorage

The maestro scratch PVC held two things: orchestra artifact payloads and
ontology git checkouts. Both subsystems have been removed from maestro, so
the volume has no remaining consumer and the values keys are gone.

To fix this error:
  1. Delete the maestro.persistence / maestro.temporaryStorage section from
     your values.yaml.

Upgrade impact:
  The <release>-maestro-scratch PVC (or the older <release>-maestro-data) is
  no longer rendered. Contents were cache, so nothing is lost. With a
  Delete-reclaim StorageClass the PVC/PV/volume are cleaned up automatically
  on upgrade; with a Retain StorageClass, delete the orphaned PV manually.
================================================================================
` }}
{{- end }}

{{- if .Values.objectStore }}
{{- fail `
================================================================================
REMOVED: objectStore

The S3 object store backed maestro's durable artifact bytes. The artifact
store has been removed, so maestro no longer reads any MAESTRO_ARTIFACT_*
env var and needs no bucket — including under ha.enabled=true.

To fix this error:
  1. Delete the objectStore section from your values.yaml.
  2. If the bucket was provisioned solely for maestro (and not shared with
     lakerunner), it can be decommissioned along with any IRSA role or
     ObjectBucketClaim created for it.
================================================================================
` }}
{{- end }}
