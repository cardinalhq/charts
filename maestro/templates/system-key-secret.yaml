{{- if and .Values.maestro.enabled (include "maestro.systemKeyGenerated" .) -}}
{{- $name := include "maestro.systemKeySecretName" . -}}
{{- $key := include "maestro.systemKeySecretKey" . -}}
{{- /* Installation system key (MAESTRO_MCP_API_KEY) shared by the maestro
       container and its mcp-gateway sidecar; rendered only when the operator
       supplies neither an env entry nor maestro.systemKeySecret.name (see
       maestro.systemKeyEnv). Reuse the existing key across upgrades so it never
       churns; generate only if absent. Pure `helm template` (no cluster, e.g.
       ArgoCD) regenerates on every render — GitOps users set
       maestro.systemKeySecret.name. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $val := "" -}}
{{- if and $existing $existing.data (index $existing.data $key) -}}
{{- $val = index $existing.data $key -}}
{{- else -}}
{{- $val = randAlphaNum 64 | b64enc -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "maestro.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $val }}
{{- end }}
