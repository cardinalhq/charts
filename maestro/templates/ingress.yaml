{{- if .Values.ingress.enabled -}}
{{- $cfg := include "maestro.dexConfig" . | fromYaml -}}
{{- include "maestro.shareIngressValidate" . -}}
{{- $shareHost := regexReplaceAll ":[0-9]+$" (include "maestro.shareHost" .) "" -}}
{{- $shareIngress := dig "ingress" "enabled" false (.Values.share | default dict) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "maestro.fullname" . }}
  labels:
    {{- include "maestro.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host | quote }}
    http:
      paths:
      {{- if $cfg.enabled }}
      # NGINX-ingress and Traefik select by longest-prefix match, so
      # path order here doesn't change which backend serves /dex/*.
      # Listed first only for readability.
      - path: {{ $cfg.pathPrefix }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "maestro.dexFullname" . }}
            port:
              name: http
      {{- end }}
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "maestro.fullname" . }}-maestro
            port:
              name: http
  {{- if $shareIngress }}
  # Public storyboard links (share.host). Everything goes to maestro, which
  # serves only /s/*, /api/public/* and static assets on this host and 404s
  # the rest; /dex is deliberately not routed here.
  - host: {{ $shareHost | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "maestro.fullname" . }}-maestro
            port:
              name: http
  {{- end }}
{{- end }}
