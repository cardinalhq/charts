apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flamethrower.fullname" . }}
  labels: {{- include "flamethrower.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "flamethrower.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "flamethrower.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: flamethrower
          image: {{ include "flamethrower.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if eq .Values.mode "serve" }}
            - serve
            - --destinations=/etc/flamethrower/destinations.yaml
            - --max-duration={{ .Values.maxDuration }}
            {{- if .Values.database.enabled }}
            - --database-url=postgres://
            {{- end }}
            - --control-addr={{ .Values.controlAddr }}
            {{- if .Values.scenariosDir }}
            - --scenarios-dir={{ .Values.scenariosDir }}
            {{- end }}
            {{- if .Values.pubsubNotifyUrl }}
            - --pubsub-notify-url={{ .Values.pubsubNotifyUrl }}
            {{- end }}
            {{- if .Values.lakerunner.queryUrl }}
            - --lakerunner-url={{ .Values.lakerunner.queryUrl }}
            - --lakerunner-installation={{ required "lakerunner.installationId is required with lakerunner.queryUrl" .Values.lakerunner.installationId }}
            {{- if .Values.lakerunner.probeUrl }}
            - --lakerunner-probe-url={{ .Values.lakerunner.probeUrl }}
            {{- end }}
            {{- if .Values.lakerunner.queriesFile }}
            - --lakerunner-queries={{ .Values.lakerunner.queriesFile }}
            {{- end }}
            {{- end }}
            {{- if .Values.fleet.enabled }}
            - --shard-rate={{ .Values.fleet.shardRate }}
            - --ready-timeout={{ .Values.fleet.readyTimeout }}
            - --stagger={{ .Values.fleet.stagger }}
            - --job-image={{ .Values.fleet.image | default (include "flamethrower.image" .) }}
            - --job-service-account={{ .Values.fleet.serviceAccount | default .Values.serviceAccount.name }}
            - --job-cpu={{ .Values.fleet.resources.cpu }}
            - --job-memory={{ .Values.fleet.resources.memory }}
            - --controller-url={{ .Values.fleet.controllerUrl | default (printf "http://%s:%v" (include "flamethrower.fullname" .) .Values.service.port) }}
            {{- if .Values.fleet.namespace }}
            - --job-namespace={{ .Values.fleet.namespace }}
            {{- end }}
            {{- if or .Values.auth.token .Values.auth.existingSecret }}
            # The shards report counters over the same bearer auth as the UI.
            # A key mismatch is silent -- the flood runs, every POST 401s --
            # so it is derived from the secret the chart actually wires up.
            - --job-auth-secret={{ if .Values.auth.existingSecret }}{{ .Values.auth.existingSecret }}{{ else }}{{ include "flamethrower.fullname" . }}-auth{{ end }}
            - --job-auth-secret-key=FLAMETHROWER_AUTH_TOKEN
            {{- end }}
            # The SDK resolves its region from the environment; shard pods
            # frequently cannot reach IMDS to fall back on.
            - --job-env=AWS_REGION={{ .Values.auth.region }}
            {{- if .Values.s3.usePathStyle }}
            - --job-env=S3_USE_PATH_STYLE=true
            {{- end }}
            {{- range $k, $v := .Values.fleet.env }}
            - --job-env={{ $k }}={{ $v }}
            {{- end }}
            {{- end }}
            {{- else if eq .Values.mode "corpus" }}
            - corpus
            - --corpus-src={{ required "corpus.srcUri is required when mode=corpus" .Values.corpus.srcUri }}
            - --corpus-cache-dir={{ .Values.corpus.cacheDir }}
            - --corpus-pick={{ .Values.corpus.pick }}
            - --corpus-name-prefix={{ .Values.corpus.namePrefix }}
            {{- if .Values.corpus.rebaseTimestamps }}
            - --corpus-rebase-timestamps
            {{- end }}
            {{- if .Values.corpus.verifySha }}
            - --corpus-verify-sha
            {{- end }}
            - --rate={{ .Values.rate }}
            - --concurrency={{ .Values.concurrency }}
            - --s3-path=s3://{{ .Values.s3.bucket }}/{{ .Values.s3.prefix }}
            - --control-addr={{ .Values.controlAddr }}
            {{- if .Values.pubsubNotifyUrl }}
            - --pubsub-notify-url={{ .Values.pubsubNotifyUrl }}
            {{- end }}
            {{- else }}
            - loggen
            - --style={{ .Values.style }}
            - --rate={{ .Values.rate }}
            - --max-batch={{ .Values.maxBatch }}
            - --concurrency={{ .Values.concurrency }}
            - --s3-path=s3://{{ .Values.s3.bucket }}/{{ .Values.s3.prefix }}
            - --control-addr={{ .Values.controlAddr }}
            {{- if .Values.pubsubNotifyUrl }}
            - --pubsub-notify-url={{ .Values.pubsubNotifyUrl }}
            {{- end }}
            {{- end }}
          env:
            - name: AWS_REGION
              value: {{ .Values.auth.region | quote }}
            {{- if .Values.s3.usePathStyle }}
            - name: S3_USE_PATH_STYLE
              value: "true"
            {{- end }}
            {{- if eq .Values.auth.mode "static" }}
            - name: AWS_ENDPOINT_URL_S3
              value: {{ .Values.auth.endpointUrl | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
            {{- if eq .Values.mode "serve" }}
            {{- if or .Values.auth.token .Values.auth.existingSecret }}
            - name: FLAMETHROWER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.auth.existingSecret }}{{ .Values.auth.existingSecret }}{{ else }}{{ include "flamethrower.fullname" . }}-auth{{ end }}
                  key: FLAMETHROWER_AUTH_TOKEN
            {{- end }}
            {{- if .Values.database.enabled }}
            # pgx fills in whatever the bare URL leaves out from PG* env.
            - name: PGHOST
              value: {{ required "database.host is required with database.enabled" .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.name | quote }}
            - name: PGUSER
              value: {{ .Values.database.username | quote }}
            - name: PGSSLMODE
              value: {{ .Values.database.sslMode | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.secretName is required with database.enabled" .Values.database.secretName }}
                  key: {{ .Values.database.passwordKey }}
            - name: FLAMETHROWER_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.tokens.existingSecret }}{{ .Values.tokens.existingSecret }}{{ else if .Values.tokens.key }}{{ include "flamethrower.fullname" . }}-tokens{{ else }}{{ fail "database.enabled needs tokens.key or tokens.existingSecret" }}{{ end }}
                  key: FLAMETHROWER_TOKEN_KEY
            {{- end }}
            {{- if .Values.lakerunner.queryUrl }}
            - name: LAKERUNNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "lakerunner.existingSecret is required with lakerunner.queryUrl" .Values.lakerunner.existingSecret }}
                  key: LAKERUNNER_API_KEY
            {{- if .Values.lakerunner.probeUrl }}
            - name: LAKERUNNER_PROBE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lakerunner.existingSecret }}
                  key: LAKERUNNER_PROBE_API_KEY
            {{- end }}
            {{- end }}
            {{- end }}
          ports:
            - name: control
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: control
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if eq .Values.mode "serve" }}
          volumeMounts:
            - name: destinations
              mountPath: /etc/flamethrower
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- else if eq .Values.mode "corpus" }}
          volumeMounts:
            - name: corpus-cache
              mountPath: {{ .Values.corpus.cacheDir }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if eq .Values.mode "serve" }}
      volumes:
        - name: destinations
          configMap:
            name: {{ include "flamethrower.fullname" . }}-destinations
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else if eq .Values.mode "corpus" }}
      volumes:
        - name: corpus-cache
          emptyDir:
            sizeLimit: {{ .Values.corpus.cacheSize }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
