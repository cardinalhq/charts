image:
  repository: public.ecr.aws/cardinalhq.io/flamethrower
  tag: ""           # empty -> chart appVersion
  pullPolicy: IfNotPresent

# mode selects the binary subcommand: serve (flood UI) or loggen (direct generator)
mode: serve

# --- serve mode config ---
# List of destinations rendered into /etc/flamethrower/destinations.yaml
# Each entry: {name, bucket, prefix}
destinations: []
# - name: my-dest
#   bucket: my-bucket
#   prefix: otel-raw/org/collector

# When set, adds --scenarios-dir to the serve args.
# The operator must mount their own scenario ConfigMap via extraVolumes/extraVolumeMounts.
scenariosDir: ""

# Maximum flood duration (serve mode)
maxDuration: 1h

# Extra volumes/mounts for operator-supplied scenario ConfigMaps, etc.
extraVolumes: []
extraVolumeMounts: []

# --- sharded flood fleet (serve mode) ---
# A single pod rendering a high-cardinality scenario needs many cores and tens
# of GB, which is hard to schedule. With fleet.enabled, the UI pod instead
# launches each flood as an Indexed Job of `shards` small pods and deletes it to
# stop, so the UI itself stays tiny and an idle fleet costs nothing.
fleet:
  enabled: false

  # Fleet size: pods, and the number of slices the scenario is split into.
  # Each shard renders 1/N of the series space, so template memory and startup
  # CPU divide by N.
  shards: 32

  # Lead time before the coordinated start. Creating the Job makes N pods
  # Pending, which is what triggers the autoscaler, so this is the node
  # provisioning window plus template rendering.
  lead: 5m

  # Image the shard pods run. Empty uses the same image as the UI, which is
  # what you want: the shards must run the code the UI expects.
  image: ""

  # Namespace for the flood Job. Empty uses the release namespace.
  namespace: ""

  # Where shards POST their counters for the UI's fleet totals. Empty uses the
  # in-cluster Service this chart renders.
  reportUrl: ""

  # Identity the shard pods run as. They write to the destination bucket, so
  # this must be an account that may do so -- on EKS, the one carrying the Pod
  # Identity association or IRSA annotation. Empty reuses serviceAccount.name,
  # which is normally exactly that account. The shards need no API access.
  serviceAccount: ""

  # One shard's footprint. Times `shards` this is the flood's whole footprint,
  # and so decides whether it schedules at all. Memory is both request and
  # limit: a shard's working set is its pre-rendered templates, known up front.
  resources:
    cpu: "1"
    memory: 2Gi

  # Extra NAME: VALUE environment for the shard pods. AWS_REGION is passed
  # automatically from auth.region, and S3_USE_PATH_STYLE from s3.usePathStyle.
  env: {}

  rbac:
    # Role + RoleBinding granting the UI exactly create/get/delete on Jobs in
    # its own namespace, which is the entire Kubernetes API surface it uses.
    # Disable only if you bind those verbs yourself.
    create: true

# --- loggen mode config ---
# Generator config (passed as CLI args to `loggen`)
# Starting rate; the skill drives the real load via POST /rate. Keep this
# small but non-zero so the limiter parks after its initial burst, letting
# /readyz flip after the first send.
rate: 1
style: k8s-filelog
concurrency: 10
maxBatch: 10000
controlAddr: ":8080"

# When set, loggen POSTs a synthetic S3 event to this URL after each successful
# PUT — for S3-compatible stores (e.g. Ceph RGW) whose bucket notifications are
# disabled or too slow. Empty disables (real S3 emits its own notifications).
# e.g. http://lakerunner-pubsub-http:8080
pubsubNotifyUrl: ""

s3:
  bucket: ""
  prefix: ""        # e.g. "otel-raw/<orgUUID>/<collector>"
  usePathStyle: false  # true for S3-compatible stores that need path-style
                       # addressing instead of virtual-host DNS (e.g. Ceph RGW)

auth:
  mode: irsa        # irsa | static
  roleArn: ""       # required when mode=irsa
  endpointUrl: ""   # required when mode=static (e.g. ceph endpoint)
  region: us-east-2
  secretName: ""    # name of existing Secret with AWS_ACCESS_KEY_ID/SECRET; required when mode=static
  # staticCreds is optional; when set the chart renders a Secret with these values
  # (the skill uses this to seed creds without exposing them on disk).
  # staticCreds:
  #   accessKeyId: ""
  #   secretAccessKey: ""
  token: ""           # when set, rendered into a Secret as FLAMETHROWER_AUTH_TOKEN
  existingSecret: ""  # name of existing Secret with key FLAMETHROWER_AUTH_TOKEN

serviceAccount:
  create: true
  name: flamethrower-flood
  annotations: {}

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 8080

metrics:
  serviceMonitor:
    enabled: false
    interval: 15s
    labels: {}
