image:
  repository: public.ecr.aws/cardinalhq.io/flamethrower
  tag: ""           # empty -> chart appVersion
  pullPolicy: IfNotPresent

# mode selects the binary subcommand:
#   serve  - host the flood calibration UI
#   loggen - directly generate synthetic OTLP logs
#   corpus - replay pre-recorded log objects from an S3 corpus manifest
mode: serve

# --- serve mode config ---
# List of destinations rendered into /etc/flamethrower/destinations.yaml
# Each entry: {name, bucket, prefix}
destinations: []
# - name: my-dest
#   bucket: my-bucket
#   prefix: otel-raw/org/collector

# When set, adds --scenarios-dir to the serve args.
# The operator must mount their own scenario ConfigMap via extraVolumes/extraVolumeMounts.
scenariosDir: ""

# Maximum flood duration (serve mode)
maxDuration: 1h

# Extra volumes/mounts for operator-supplied scenario ConfigMaps, etc.
extraVolumes: []
extraVolumeMounts: []

# --- lakerunner system health (serve mode) ---
# With queryUrl set, the UI polls this lakerunner's query-api for the pods,
# sizing, CPU and ingest rate of the process-* services and keeps a set of
# background queries running to show query latency under load.
lakerunner:
  queryUrl: ""          # e.g. https://lakerunner-query-api.example.com
  installationId: ""    # installation_id label of the lakerunner being flooded
  existingSecret: ""    # Secret holding the query-api key under LAKERUNNER_API_KEY
  # probeUrl is the query-api the probe queries run against, the lakerunner
  # the flood writes to. Empty uses queryUrl. Its key is read from the same
  # Secret under LAKERUNNER_PROBE_API_KEY.
  probeUrl: ""
  # queriesFile, when set, is passed as --lakerunner-queries; mount it via
  # extraVolumes/extraVolumeMounts. Empty runs the built-in query set.
  queriesFile: ""

# --- sharded flood fleet (serve mode) ---
# A single pod rendering a high-cardinality scenario needs many cores and tens
# of GB, which is hard to schedule. With fleet.enabled, the UI pod instead
# launches each flood as an Indexed Job of small pods sized to the requested
# rate and deletes it to stop, so the UI itself stays tiny and an idle fleet
# costs nothing.
fleet:
  enabled: false

  # Records/sec one shard pod is trusted to push. The fleet for a flood is
  # ceil(rate / shardRate) pods, so a 1M/sec flood at 200k is a 5-pod Job.
  # Each shard renders 1/N of the series space, so template memory and startup
  # CPU divide by N.
  shardRate: 200000

  # Every worker must build its templates and report ready within this window,
  # covering node provisioning plus rendering, or the run fails and the Job is
  # torn down. Creating the Job makes N pods Pending, which is what triggers
  # the autoscaler.
  readyTimeout: 10m

  # Delay between starting one shard and the next.
  stagger: 5s

  # Image the shard pods run. Empty uses the same image as the UI, which is
  # what you want: the shards must run the code the UI expects.
  image: ""

  # Namespace for the flood Job. Empty uses the release namespace.
  namespace: ""

  # Base URL the shards heartbeat to and are told to start by. Empty uses the
  # in-cluster Service this chart renders.
  controllerUrl: ""

  # Identity the shard pods run as. They write to the destination bucket, so
  # this must be an account that may do so -- on EKS, the one carrying the Pod
  # Identity association or IRSA annotation. Empty reuses serviceAccount.name,
  # which is normally exactly that account. The shards need no API access.
  serviceAccount: ""

  # One shard's footprint. Times the fleet size this is the flood's whole footprint,
  # and so decides whether it schedules at all. Memory is both request and
  # limit: a shard's working set is its pre-rendered templates, known up front.
  resources:
    cpu: "1"
    memory: 2Gi

  # Extra NAME: VALUE environment for the shard pods. AWS_REGION is passed
  # automatically from auth.region, and S3_USE_PATH_STYLE from s3.usePathStyle.
  env: {}

  rbac:
    # Role + RoleBinding granting the UI exactly create/get/delete on Jobs and
    # list on their pods in its own namespace, which is the entire Kubernetes
    # API surface it uses.
    # Disable only if you bind those verbs yourself.
    create: true

# --- loggen mode config ---
# Generator config (passed as CLI args to `loggen`)
# Starting rate; the skill drives the real load via POST /rate. Keep this
# small but non-zero so the limiter parks after its initial burst, letting
# /readyz flip after the first send.
rate: 1
style: k8s-filelog
concurrency: 10
maxBatch: 10000
controlAddr: ":8080"

# When set, loggen POSTs a synthetic S3 event to this URL after each successful
# PUT — for S3-compatible stores (e.g. Ceph RGW) whose bucket notifications are
# disabled or too slow. Empty disables (real S3 emits its own notifications).
# e.g. http://lakerunner-pubsub-http:8080
pubsubNotifyUrl: ""

s3:
  bucket: ""
  prefix: ""        # e.g. "otel-raw/<orgUUID>/<collector>"
  usePathStyle: false  # true for S3-compatible stores that need path-style
                       # addressing instead of virtual-host DNS (e.g. Ceph RGW)

auth:
  mode: irsa        # irsa | static
  roleArn: ""       # required when mode=irsa
  endpointUrl: ""   # required when mode=static (e.g. ceph endpoint)
  region: us-east-2
  secretName: ""    # name of existing Secret with AWS_ACCESS_KEY_ID/SECRET; required when mode=static
  # staticCreds is optional; when set the chart renders a Secret with these values
  # (the skill uses this to seed creds without exposing them on disk).
  # staticCreds:
  #   accessKeyId: ""
  #   secretAccessKey: ""
  token: ""           # when set, rendered into a Secret as FLAMETHROWER_AUTH_TOKEN
  existingSecret: ""  # name of existing Secret with key FLAMETHROWER_AUTH_TOKEN

serviceAccount:
  create: true
  name: flamethrower-flood
  annotations: {}

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi

service:
  type: ClusterIP
  port: 8080

metrics:
  serviceMonitor:
    enabled: false
    interval: 15s
    labels: {}

# --- corpus mode config ---
# Replay a pre-recorded corpus of zstd-compressed telemetry objects. The
# producer publishes a manifest.json under srcUri; the pod caches the
# objects locally, then PUTs them into s3.bucket/s3.prefix at the shared
# /rate. Corpus mode is selected by setting mode: corpus at the top of
# this file; this block is only consumed when mode == corpus.
corpus:
  # s3://bucket/prefix/ under which manifest.json + objects live. Empty
  # is a chart lint error when mode == corpus.
  srcUri: ""
  # Local mount point for the cache. Populated at boot from srcUri and
  # backed by an emptyDir volume sized by cacheSize.
  cacheDir: /var/cache/flamethrower/corpus
  # emptyDir sizeLimit for the cache volume. For corpora larger than
  # a few tens of GiB switch to a PVC via extraVolumes/extraVolumeMounts.
  cacheSize: 20Gi
  # round-robin | random
  pick: round-robin
  # Filename prefix used when building destination keys:
  # <s3.prefix>/year=.../<namePrefix>_<runUUID>_<seq>.binpb.zst
  namePrefix: logs
  # Re-hash cached files at boot even when size already matches. Off by
  # default: hashing multi-GB caches on every restart is expensive and
  # size-only match is safe for our producer.
  verifySha: false
