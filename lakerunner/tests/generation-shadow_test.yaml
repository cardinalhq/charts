suite: generation shadow workloads
values:
  - ../values.yaml
set:
  license.data: '{"key":"test"}'
templates:
  - generation-shadow-validation.yaml
  - generation-serviceaccounts.yaml
  - generation-coordinator-deployment.yaml
  - generation-shard-builder-deployment.yaml
tests:
  - it: renders no generation resources by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the fixed coordinator shadow deployment with no cloud credential injection
    template: generation-coordinator-deployment.yaml
    set:
      generation.coordinator.enabled: true
      generation.image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      cloudProvider.provider: aws
      cloudProvider.aws.inject: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-generation-coordinator
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-lakerunner-generation-coordinator
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/cardinalhq/lakerunner@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: /app/bin/lakerunner
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: generation-coordinator
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_COORDINATOR_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_COORDINATOR_LEASE_DURATION
            value: 300s
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_COORDINATOR_TERMINATION_GRACE
            value: 30s

  - it: renders the bounded shard builder and packaged shard binary contract
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-lakerunner-generation-shard-builder
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/cardinalhq/lakerunner@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: generation-shard-builder
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 1Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 2Gi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: 18Gi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: 18Gi
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=="generation-scratch")].mountPath
          value: /scratch/generation
      - equal:
          path: spec.template.spec.volumes[?(@.name=="generation-scratch")].emptyDir.sizeLimit
          value: 17Gi
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_SHARD_BUILDER_CONCURRENCY
            value: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_SHARD_BUILDER_SCRATCH_LIMIT_BYTES
            value: "17179869184"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_SHARD_BUILDER_TERMINATION_GRACE
            value: 30s
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_LKRN_GEN_SHARD
            value: /app/bin/lkrn-gen-shard
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOMEMLIMIT
            value: 512MiB
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOGC
            value: "50"

  - it: creates two distinct no-RBAC service accounts with token automount disabled
    template: generation-serviceaccounts.yaml
    set:
      generation.coordinator.enabled: true
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-generation-coordinator
        documentIndex: 0
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-generation-shard-builder
        documentIndex: 1
      - equal:
          path: automountServiceAccountToken
          value: false
        documentIndex: 1

  - it: rejects an absent digest when enabled
    template: generation-shard-builder-deployment.yaml
    set:
      generation.coordinator.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: generation.image.digest must be sha256

  - it: rejects a malformed or uppercase digest
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    asserts:
      - failedTemplate:
          errorPattern: generation.image.digest must be sha256

  - it: rejects shared service account identity
    template: generation-shard-builder-deployment.yaml
    set:
      generation.coordinator.enabled: true
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      generation.coordinator.serviceAccount.name: unsafe-shared
      generation.shardBuilder.serviceAccount.name: unsafe-shared
    asserts:
      - failedTemplate:
          errorPattern: service accounts must be distinct

  - it: rejects builder concurrency above one
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
      generation.shardBuilder.concurrency: 2
    asserts:
      - failedTemplate:
          errorPattern: concurrency must be exactly 1

  - it: rejects a builder memory limit above two GiB
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
      generation.shardBuilder.resources.limits.memory: 3Gi
    asserts:
      - failedTemplate:
          errorPattern: limit <= 2Gi

  - it: rejects an unsafe builder Go memory override
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
      generation.shardBuilder.env:
        - name: GOMEMLIMIT
          value: 1GiB
    asserts:
      - failedTemplate:
          errorPattern: GOMEMLIMIT.*exactly 512MiB

  - it: rejects duplicate exact Go runtime overrides
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
      global.env:
        - name: GOMEMLIMIT
          value: 512MiB
      generation.shardBuilder.env:
        - name: GOMEMLIMIT
          value: 512MiB
    asserts:
      - failedTemplate:
          errorPattern: Go runtime variables must not be duplicated

  - it: rejects insufficient scratch volume headroom
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
      generation.shardBuilder.scratchSizeLimit: 16Gi
    asserts:
      - failedTemplate:
          errorPattern: scratchSizeLimit must be at least 17Gi

  - it: rejects insufficient pod ephemeral storage
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
      generation.shardBuilder.resources.limits.ephemeral-storage: 17Gi
    asserts:
      - failedTemplate:
          errorPattern: ephemeral-storage request and limit must be at least 18Gi

  - it: rejects contradictory coordinator grace periods
    template: generation-shard-builder-deployment.yaml
    set:
      generation.coordinator.enabled: true
      generation.image.digest: sha256:3333333333333333333333333333333333333333333333333333333333333333
      generation.coordinator.podTerminationGraceSeconds: 300
    asserts:
      - failedTemplate:
          errorPattern: coordinator timing must remain

  - it: rejects contradictory builder grace periods
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
      generation.shardBuilder.terminationGraceSeconds: 45
    asserts:
      - failedTemplate:
          errorPattern: builder timing must remain

  - it: rejects an ordered but noncanonical builder timing override
    template: generation-shard-builder-deployment.yaml
    set:
      generation.shardBuilder.enabled: true
      generation.image.digest: sha256:7777777777777777777777777777777777777777777777777777777777777777
      generation.shardBuilder.terminationGraceSeconds: 29
    asserts:
      - failedTemplate:
          errorPattern: builder timing must remain
