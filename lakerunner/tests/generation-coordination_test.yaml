suite: process-logs embedded generation coordination
values:
  - ../values.yaml
set:
  license.data: '{"key":"test"}'
templates:
  - generation-shadow-validation.yaml
  - process-logs-deployment.yaml
tests:
  - it: leaves established process-logs unchanged by default
    template: process-logs-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_COORDINATOR_ENABLED
            value: "true"

  - it: embeds coordination into every process-logs replica
    template: process-logs-deployment.yaml
    set:
      generation.coordination.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-process-logs
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: process-logs
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_COORDINATOR_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_COORDINATOR_LEASE_DURATION
            value: 300s
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LAKERUNNER_GENERATION_COORDINATOR_TERMINATION_GRACE
            value: 30s

  - it: does not require the shard-builder image digest for coordination alone
    template: process-logs-deployment.yaml
    set:
      generation.coordination.enabled: true
      generation.image.digest: ""
    asserts:
      - isKind:
          of: Deployment

  - it: rejects coordination when process-logs is disabled
    template: generation-shadow-validation.yaml
    set:
      processLogs.enabled: false
      generation.coordination.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: generation coordination requires processLogs.enabled=true

  - it: rejects a reserved coordination variable in global env
    template: generation-shadow-validation.yaml
    set:
      generation.coordination.enabled: true
      global.env:
        - name: LAKERUNNER_GENERATION_COORDINATOR_ENABLED
          value: "false"
    asserts:
      - failedTemplate:
          errorPattern: global.env must not set reserved generation environment variable LAKERUNNER_GENERATION_COORDINATOR_ENABLED

  - it: rejects a reserved coordination variable in process-logs env
    template: generation-shadow-validation.yaml
    set:
      generation.coordination.enabled: true
      processLogs.env:
        - name: LAKERUNNER_GENERATION_COORDINATOR_ENABLED
          value: "false"
    asserts:
      - failedTemplate:
          errorPattern: processLogs.env must not set reserved generation environment variable LAKERUNNER_GENERATION_COORDINATOR_ENABLED

  - it: rejects contradictory coordination grace periods
    template: generation-shadow-validation.yaml
    set:
      generation.coordination.enabled: true
      generation.coordination.podTerminationGraceSeconds: 300
    asserts:
      - failedTemplate:
          errorPattern: generation coordination timing must remain
