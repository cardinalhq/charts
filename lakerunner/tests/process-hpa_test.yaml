suite: test process-* HorizontalPodAutoscalers
templates:
  - process-hpa.yaml
values:
  - ../values.yaml
set:
  cloudProvider.aws.region: us-west-2
  license.data: '{"key":"test"}'
tests:
  # Document order: logs ingest(0) compact(1); metrics partition(2)
  # materialize(3) compact(4) rollup(5); traces ingest(6) compact(7).
  - it: renders one HPA per signal and role
    asserts:
      - hasDocuments:
          count: 8
      - isKind:
          of: HorizontalPodAutoscaler
        documentIndex: 0
      - equal:
          path: apiVersion
          value: autoscaling/v2
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-logs-ingest
        documentIndex: 0
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-logs-compact
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-metrics-partition
        documentIndex: 2
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-metrics-materialize
        documentIndex: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-metrics-compact
        documentIndex: 4
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-metrics-rollup
        documentIndex: 5
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-traces-ingest
        documentIndex: 6
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-traces-compact
        documentIndex: 7
      - equal:
          path: metadata.labels["lakerunner.cardinalhq.io/signal"]
          value: metrics
        documentIndex: 3
      - equal:
          path: metadata.labels["lakerunner.cardinalhq.io/role"]
          value: materialize
        documentIndex: 3

  - it: each HPA targets its own deployment and container with bounds, cpu target, and behavior
    asserts:
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-lakerunner-logs-ingest
        documentIndex: 0
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME-lakerunner-metrics-rollup
        documentIndex: 5
      - equal:
          path: spec.minReplicas
          value: 1
        documentIndex: 0
      - equal:
          path: spec.maxReplicas
          value: 10
        documentIndex: 0
      - equal:
          path: spec.metrics[0].containerResource.target.averageUtilization
          value: 80
        documentIndex: 0
      - equal:
          path: spec.metrics[0].type
          value: ContainerResource
        documentIndex: 0
      - equal:
          path: spec.metrics[0].containerResource.container
          value: logs-ingest
        documentIndex: 0
      - equal:
          path: spec.metrics[0].containerResource.container
          value: metrics-materialize
        documentIndex: 3
      - equal:
          path: spec.metrics[0].containerResource.container
          value: traces-compact
        documentIndex: 7
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 120
        documentIndex: 0
      - equal:
          path: spec.behavior.scaleUp.stabilizationWindowSeconds
          value: 180
        documentIndex: 0
      - equal:
          path: spec.behavior.scaleUp.policies[1].type
          value: Pods
        documentIndex: 0
      - equal:
          path: spec.behavior.scaleUp.policies[1].value
          value: 8
        documentIndex: 0

  - it: signal-level min/max and target apply to every role of that signal
    set:
      process.logs.autoscaling.minReplicas: 2
      process.logs.autoscaling.maxReplicas: 25
      process.logs.autoscaling.targetCPUUtilizationPercentage: 70
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
        documentIndex: 0
      - equal:
          path: spec.maxReplicas
          value: 25
        documentIndex: 0
      - equal:
          path: spec.metrics[0].containerResource.target.averageUtilization
          value: 70
        documentIndex: 0
      - equal:
          path: spec.maxReplicas
          value: 25
        documentIndex: 1
      - equal:
          path: spec.maxReplicas
          value: 10
        documentIndex: 2

  - it: a role override replaces the signal default for that role only
    set:
      process.metrics.autoscaling.maxReplicas: 12
      process.metrics.roles.compact.autoscaling.maxReplicas: 3
      process.metrics.roles.compact.autoscaling.targetCPUUtilizationPercentage: 60
    asserts:
      - equal:
          path: spec.maxReplicas
          value: 12
        documentIndex: 2
      - equal:
          path: spec.maxReplicas
          value: 3
        documentIndex: 4
      - equal:
          path: spec.metrics[0].containerResource.target.averageUtilization
          value: 60
        documentIndex: 4
      - equal:
          path: spec.metrics[0].containerResource.target.averageUtilization
          value: 80
        documentIndex: 5

  - it: a legacy processMetrics block is read as the metrics signal defaults
    set:
      processMetrics:
        autoscaling:
          minReplicas: 2
          maxReplicas: 15
    asserts:
      - equal:
          path: spec.minReplicas
          value: 2
        documentIndex: 2
      - equal:
          path: spec.maxReplicas
          value: 15
        documentIndex: 5
      - equal:
          path: spec.maxReplicas
          value: 10
        documentIndex: 0

  - it: the materialize role's inherited maxReplicas is clamped to process.metrics.partitions
    set:
      process.metrics.partitions: 4
      process.metrics.autoscaling.maxReplicas: 20
    asserts:
      - equal:
          path: spec.maxReplicas
          value: 20
        documentIndex: 2
      - equal:
          path: spec.maxReplicas
          value: 4
        documentIndex: 3
      - equal:
          path: spec.maxReplicas
          value: 20
        documentIndex: 5

  - it: an explicit materialize maxReplicas above the partition count fails the render
    set:
      process.metrics.partitions: 4
      process.metrics.roles.materialize.autoscaling.maxReplicas: 5
    asserts:
      - failedTemplate:
          errorPattern: "maxReplicas \\(5\\) exceeds process.metrics.partitions \\(4\\)"

  - it: an explicit materialize maxReplicas at or below the partition count renders
    set:
      process.metrics.partitions: 4
      process.metrics.roles.materialize.autoscaling.maxReplicas: 4
    asserts:
      - equal:
          path: spec.maxReplicas
          value: 4
        documentIndex: 3

  - it: a per-signal behavior override replaces the global behavior
    set:
      process.logs.autoscaling.behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
    asserts:
      - equal:
          path: spec.behavior.scaleDown.stabilizationWindowSeconds
          value: 600
        documentIndex: 0
      - notExists:
          path: spec.behavior.scaleUp
        documentIndex: 0

  - it: falls back to target 85 and no behavior when global.autoscaling.hpa is unset
    set:
      global.autoscaling.hpa: null
    asserts:
      - equal:
          path: spec.metrics[0].containerResource.target.averageUtilization
          value: 85
        documentIndex: 0
      - notExists:
          path: spec.behavior
        documentIndex: 0

  - it: omits every HPA of a disabled signal
    set:
      process.traces.enabled: false
    asserts:
      - hasDocuments:
          count: 6
      - equal:
          path: metadata.name
          value: RELEASE-NAME-lakerunner-metrics-rollup
        documentIndex: 5
