{{- include "lakerunner.validateGenerationShadow" . -}}
{{- if .Values.generation.shardBuilder.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakerunner.fullname" . }}-generation-shard-builder
  labels:
    {{- include "lakerunner.labelsWithComponent" (list . .Values.generation.shardBuilder.labels) | nindent 4 }}
    app.kubernetes.io/component: generation-shard-builder
  {{- include "lakerunner.annotationsWithComponent" (list . .Values.generation.shardBuilder.annotations) | nindent 2 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lakerunner.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: generation-shard-builder
  template:
    metadata:
      labels:
        {{- include "lakerunner.labelsWithComponent" (list . .Values.generation.shardBuilder.labels) | nindent 8 }}
        app.kubernetes.io/component: generation-shard-builder
        {{- if and (eq .Values.cloudProvider.provider "azure") (eq .Values.cloudProvider.azure.authType "workload_identity") }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- include "lakerunner.annotationsWithComponent" (list . .Values.generation.shardBuilder.annotations) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "lakerunner.generationShardBuilderServiceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.generation.shardBuilder.podTerminationGraceSeconds }}
      {{- include "lakerunner.podSecurityContext" (dict "root" . "override" .Values.generation.shardBuilder.podSecurityContext) | nindent 6 }}
      {{- include "lakerunner.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: generation-shard-builder
          {{- include "lakerunner.containerSecurityContext" (dict "root" . "override" .Values.generation.shardBuilder.containerSecurityContext) | nindent 10 }}
          image: {{ include "lakerunner.generationImage" . | quote }}
          imagePullPolicy: {{ .Values.generation.image.pullPolicy }}
          command: ["/app/bin/lakerunner"]
          args: ["generation-shard-builder"]
          ports:
            - name: healthcheck
              containerPort: {{ .Values.global.healthProbes.healthcheckPort }}
              protocol: TCP
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-generation-shard-builder" (include "lakerunner.fullname" .) | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_ENABLED
              value: "true"
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_LEASE_DURATION
              value: {{ printf "%ds" (int .Values.generation.shardBuilder.leaseDurationSeconds) | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_POLL_INTERVAL
              value: {{ .Values.generation.shardBuilder.pollInterval | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_NO_WORK_BACKOFF_INITIAL
              value: {{ .Values.generation.shardBuilder.noWorkBackoffInitial | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_NO_WORK_BACKOFF_MAX
              value: {{ .Values.generation.shardBuilder.noWorkBackoffMax | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_ERROR_BACKOFF_INITIAL
              value: {{ .Values.generation.shardBuilder.errorBackoffInitial | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_ERROR_BACKOFF_MAX
              value: {{ .Values.generation.shardBuilder.errorBackoffMax | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_BACKOFF_JITTER
              value: {{ .Values.generation.shardBuilder.backoffJitter | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_CONCURRENCY
              value: {{ .Values.generation.shardBuilder.concurrency | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_SCRATCH_DIRECTORY
              value: {{ .Values.generation.shardBuilder.scratchDirectory | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_SCRATCH_LIMIT_BYTES
              value: {{ printf "%d" (int64 .Values.generation.shardBuilder.scratchLimitBytes) | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_RESIDENT_MEMORY_LIMIT_BYTES
              value: {{ printf "%d" (int64 .Values.generation.shardBuilder.residentMemoryLimitBytes) | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_SPILL_FAIL_THRESHOLD_BYTES
              value: {{ printf "%d" (int64 .Values.generation.shardBuilder.spillFailThresholdBytes) | quote }}
            - name: LAKERUNNER_GENERATION_SHARD_BUILDER_TERMINATION_GRACE
              value: {{ printf "%ds" (int .Values.generation.shardBuilder.terminationGraceSeconds) | quote }}
            - name: LAKERUNNER_LKRN_GEN_SHARD
              value: /app/bin/lkrn-gen-shard
            {{- if eq .Values.cloudProvider.provider "azure" }}
            - name: AZURE_AUTH_TYPE
              value: {{ .Values.cloudProvider.azure.authType | quote }}
            {{- end }}
            {{- include "lakerunner.injectGenerationShardBuilderEnv" (list . .Values.generation.shardBuilder) | nindent 10 }}
            {{- include "lakerunner.cardinalTelemetryEnv" . | nindent 12 }}
          {{- if eq (include "lakerunner.injectCloudProviderCredentials" .) "true" }}
          envFrom:
            - secretRef:
                name: {{ include "lakerunner.cloudProviderSecretName" . }}
          {{- end }}
          {{- include "lakerunner.healthProbes" (list . .Values.generation.shardBuilder) | nindent 10 }}
          resources:
            {{- toYaml .Values.generation.shardBuilder.resources | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.storageProfiles.source "config" }}
            - name: storage-profiles
              mountPath: /app/config/storage_profiles.yaml
              subPath: storage_profiles.yaml
              readOnly: true
            {{- end }}
            - name: generation-scratch
              mountPath: /scratch/generation
            {{- include "lakerunner.azureTokenVolumeMount" . | nindent 12 }}
            {{- include "lakerunner.licenseVolumeMount" . | nindent 12 }}
      {{- include "lakerunner.sched.nodeSelector" (list .Values.global.nodeSelector .Values.generation.shardBuilder.nodeSelector) | nindent 6 }}
      {{- include "lakerunner.sched.tolerations" (list .Values.global.tolerations .Values.generation.shardBuilder.tolerations) | nindent 6 }}
      {{- include "lakerunner.sched.affinity" (list .Values.global.affinity .Values.generation.shardBuilder.affinity) | nindent 6 }}
      volumes:
        - name: generation-scratch
          emptyDir:
            sizeLimit: {{ .Values.generation.shardBuilder.scratchSizeLimit | quote }}
        {{- if eq .Values.storageProfiles.source "config" }}
        - name: storage-profiles
          configMap:
            name: {{ include "lakerunner.storageProfilesConfigmapName" . }}
        {{- end }}
        {{- include "lakerunner.azureTokenVolume" . | nindent 8 }}
        {{- include "lakerunner.licenseVolume" . | nindent 8 }}
{{- end }}
