{{- include "lakerunner.validateGenerationShadow" . -}}
{{- if .Values.generation.coordinator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lakerunner.generationCoordinatorServiceAccountName" . }}
  labels:
    {{- include "lakerunner.labelsWithComponent" (list . .Values.generation.coordinator.labels) | nindent 4 }}
    app.kubernetes.io/component: generation-coordinator
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.generation.coordinator.enabled .Values.generation.shardBuilder.enabled }}
---
{{- end }}
{{- if .Values.generation.shardBuilder.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lakerunner.generationShardBuilderServiceAccountName" . }}
  labels:
    {{- include "lakerunner.labelsWithComponent" (list . .Values.generation.shardBuilder.labels) | nindent 4 }}
    app.kubernetes.io/component: generation-shard-builder
  {{- with .Values.generation.shardBuilder.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
